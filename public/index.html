<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerable Portal - Demo Target</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0a0a0a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; margin-bottom: 2rem; }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #f87171; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #9ca3af; }
        input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; background: #262626; border: 1px solid #404040; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #ef4444; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #dc2626; }
        .result { margin-top: 1rem; font-size: 0.875rem; color: #9ca3af; padding: 0.5rem; background: #262626; border-radius: 4px; display: none; }
        .links { text-align: center; font-size: 0.75rem; color: #6b7280; }
        .links a { color: #3b82f6; text-decoration: none; margin: 0 0.5rem; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Admin Portal Login</h1>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter username">
            
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter password">
            
            <button type="submit">Log In</button>
        </form>
        <div id="loginResult" class="result"></div>
    </div>

    <div class="container">
        <h1>User Search</h1>
        <form id="searchForm">
            <label for="search">Search Term</label>
            <input type="text" id="search" name="q" placeholder="Enter username to search">
            <button type="submit">Search</button>
        </form>
        <div id="searchResult" class="result"></div>
    </div>

    <div class="links">
        <p>Intentionally Vulnerable Endpoints (for Recon tools)</p>
        <a href="/.env">/.env</a>
        <a href="/admin/backup.sql">/admin/backup.sql</a>
        <a href="/api/internal/stats">/api/internal/stats</a>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('loginResult');
            const data = {
                username: e.target.username.value,
                password: e.target.password.value
            };
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                resDiv.style.display = 'block';
                resDiv.textContent = JSON.stringify(result, null, 2);
                resDiv.style.color = response.ok ? '#4ade80' : '#f87171';
            } catch (err) {
                resDiv.style.display = 'block';
                resDiv.textContent = err.message;
            }
        });

        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resDiv = document.getElementById('searchResult');
            try {
                const response = await fetch(`/api/users?q=${encodeURIComponent(e.target.q.value)}`);
                const result = await response.json();
                resDiv.style.display = 'block';
                resDiv.style.color = '#fff';
                resDiv.textContent = JSON.stringify(result, null, 2);
            } catch (err) {
                resDiv.style.display = 'block';
                resDiv.textContent = err.message;
            }
        });
    </script>
</body>
</html>
